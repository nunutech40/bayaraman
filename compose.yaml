services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bayaraman
      POSTGRES_USER: bayaraman
      POSTGRES_PASSWORD: bayaraman_local
    ports:
      - "54329:5432"
    volumes:
      - bayaraman-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayaraman -d bayaraman"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bayaraman-postgres:
