services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bayaraman-staging:local
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: bayaraman
      POSTGRES_USER: bayaraman
    networks:
      - data
    volumes:
      - bayaraman-staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayaraman -d bayaraman"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    image: bayaraman-staging:local
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
    command: ["npm", "run", "db:migrate"]
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

networks:
  edge:
    external: true
    name: kohnu-production_edge
  data:
    name: bayaraman-staging-data

volumes:
  bayaraman-staging-postgres:
